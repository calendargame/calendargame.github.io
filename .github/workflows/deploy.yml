# Tells GitHub how to build this app and publish it to GitHub Pages.
name: Deploy to GitHub Pages

# When should the robot run?
on:
  push:
    branches: [main]      # automatically, every time code is pushed to main — and ONLY that.
# ⚠ `workflow_dispatch` (the Actions tab's "Run workflow" button) was REMOVED 2026-08-10, and it is
# worth knowing why rather than re-adding it. It had never been used, and TWO independent guards now
# refuse it: the changelog-date check fails any run on a later Pacific day than the newest entry, and
# the version-ledger check below fails any run whose version has already shipped — which a re-publish
# of an unchanged commit always has. Keeping a button that cannot succeed is keeping a locked door
# with a handle on it. A deploy is a push; that is now the only thing it can be.
# ⚠ RE-RUNNING FROM THE ACTIONS TAB: WHICH BUTTON MATTERS, because the two are not interchangeable.
# "Re-run failed jobs" re-runs only what failed — so if the BUILD passed (its version tag written)
# and only PUBLISHING failed, that button finishes the job and the version is not spent. "Re-run all
# jobs" re-runs the version check too, which will refuse the number the first attempt already
# claimed. Bumping in that situation is the wrong move and costs a pointless version plus a
# changelog edit; scripts/versionLedger.mjs's failure message spells out both cases.

# What the robot is allowed to do.
# ⚠ `contents` is WRITE, not read, since 2026-08-10: the build job's last step writes a `v<version>`
# tag recording that this version has shipped here (see the version-ledger steps below). It is
# GitHub's own built-in job token and it can only reach the repository running the workflow — there
# is no secret to create, rotate or leak. The deploy job overrides this back down to read, because
# publishing needs no write access at all.
permissions:
  contents: write
  pages: write
  id-token: write

# Never run two deploys at once; let the newest push win.
#
# ⚠ THE GROUP NAME IS SCOPED TO THIS WORKFLOW (2026-08-10). It was the bare literal `pages`, copied
# from GitHub's Pages starter template. A concurrency group is a per-REPOSITORY namespace, so any
# future workflow declaring that same generic literal would silently share this lock — and with
# `cancel-in-progress: true` that means an unrelated job could CANCEL a deploy. A cancelled run is
# not a failed one: nothing goes red, and it is easy to miss entirely.
# ★ THE VERSION LEDGER IS WHAT MADE THAT NEWLY EXPENSIVE, and it is the reason this was worth
# changing at all rather than left as a tidiness note. A run cancelled AFTER its tagging step has
# SPENT A VERSION NUMBER without publishing anything, so an accidental cross-workflow cancellation
# now costs a number as well as a deploy.
# ⚠ THE TRADE, WRITTEN DOWN SO IT IS NOT REDISCOVERED AS A BUG: the bare literal also acted as a
# repo-wide "only one Pages deployment at a time" lock, and scoping the name gives that up. GitHub
# Pages really does allow only one deployment at a time — so IF a second Pages-deploying workflow is
# ever added to either repo, it must join THIS group by name rather than inventing its own.
concurrency:
  group: ${{ github.workflow }}-pages
  cancel-in-progress: true

jobs:
  # Step 1: assemble the finished website.
  build:
    runs-on: ubuntu-latest
    steps:
      # ⚠ fetch-depth: 0 IS LOAD-BEARING — DO NOT DROP IT BACK TO THE DEFAULT. The default is
      # fetch-depth: 1, a clone containing exactly one commit, and the build number is
      # `git rev-list --count HEAD` (scripts/buildNumber.mjs). A shallow clone does not make that
      # command fail — it makes it return 1, on every deploy, forever, with nothing looking broken.
      # The full history is ~200 commits of a small repo, so the cost is a second at most.
      # (buildNumber.mjs also refuses a shallow checkout outright, so if this line is ever removed
      # the build FAILS with instructions instead of silently flattening the number. Belt and braces,
      # deliberately: the guard is what makes the workflow safe to edit.)
      #
      # ⚠ SINCE 2026-08-10 IT CARRIES A SECOND, UNRELATED LOAD: TAGS. `fetch-depth: 0` is also the
      # only reason the version ledger below can see what has already shipped here. Verified in the
      # action's own source rather than taken from its README: fetch-depth <= 0 selects
      # `getRefSpecForAllHistory`, whose refspec includes `+refs/tags/*:refs/tags/*`, and
      # git-command-manager only adds `--no-tags` when that refspec is ABSENT. So tags arrive because
      # of this line and for no other reason — and versionLedger.mjs fails closed on an empty tag
      # list, so if that ever changes the deploy stops rather than approving every version forever.
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history AND all tags — the build number and the version ledger
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'   # matches the Node version on the laptop
          cache: npm
      # ── THE VERSION BUMP GUARD, HALF 1 OF 2 ──────────────────────────────────────────────────
      # Refuses the deploy unless package.json's version is HIGHER than every version this site has
      # already published. The record it reads is the `v*` tags in this repository, written by half 2
      # at the bottom of this job. All the reasoning lives in scripts/versionLedger.mjs; the short
      # version is that a deploy does not need a new commit (a re-publish of the same commit is a
      # genuinely different artifact), so nothing derived from the COMMIT can enforce this rule.
      # It also refuses a version that package-lock.json's own copy disagrees with (a bump that
      # reached package.json alone) — the same script, the same two seconds.
      #
      # FIRST, and deliberately even before `npm ci`: it needs nothing but node and git, so a version
      # that cannot ship costs about two seconds instead of a dependency install and a three-minute
      # test run. ⚠ Do not move it below `npm ci` for tidiness, and do not give the script a
      # dependency — being free to run this early is the point.
      #
      # ⚠ IT DEPENDS ON `fetch-depth: 0` ABOVE FOR TAGS, not just for history. If tags ever stop
      # arriving, the check FAILS rather than passing on an empty list — that fail-closed choice is
      # the difference between this guard and one that silently approves everything forever.
      - name: Check this version has never shipped here
        id: version
        run: node scripts/checkVersionLedger.mjs
      - name: Install dependencies
        run: npm ci
      # EARLY — second only to the version ledger above, which needs no dependencies and so runs even
      # cheaper. This one is among the cheapest in the gate (a second) and is one of the two that can
      # fail for a reason that has nothing to do with the code. Every deploy ships exactly one
      # changelog entry dated its own PACIFIC calendar day; the build enforces that too (the
      # changelog-stamp plugin in vite.config.js is the real authority, since it also gates a local
      # `npm run build`), but the build step is five minutes down this file, so without this step a
      # mis-dated changelog costs the entire gate before anyone hears about it.
      #
      # ⚠ THIS IS WHY A RE-DEPLOY OF AN UNCHANGED COMMIT CAN FAIL. The rule is EQUALITY against the
      # build day, so "Re-run all jobs" on a LATER Pacific day than the newest changelog entry fails
      # here — as does pushing the same commit to the staging repo one evening and the live repo the
      # next morning. That is the guard working, not a fault: the fix is a commit that re-dates the
      # newest entry (and, if that day already shipped, a new entry for the new day). There is
      # deliberately no bypass; the failure message spells out both cases.
      - name: Check the changelog date
        run: node scripts/checkChangelogDate.mjs
      # Quality gate — a failing test, lint error, TYPE error, or FORMATTING drift blocks the deploy,
      # so broken date math / logic can never reach the site. Tests run first (cheapest signal).
      - name: Run tests
        run: npm test
      - name: Lint
        run: npm run lint
      # Formatting gate — Prettier must be clean (npm run format locally to fix). Without this, style
      # drift silently re-accumulates on edited files (it has twice); now it can never ship.
      - name: Check formatting
        run: npm run format:check
      - name: Type-check
        run: npm run typecheck
      - name: Build the site
        run: npm run build
      # Custom domain: the LIVE org repo serves at calendargame.app. A CNAME file in the deployed
      # artifact makes GitHub Pages set + persist that custom domain across every Actions deploy
      # (so it can't silently reset). Only the live repo gets it — the staging repo (test_version)
      # keeps its github.io project URL.
      - name: Add CNAME for the custom domain (live repo only)
        if: github.repository == 'calendargame/calendargame.github.io'
        run: echo 'calendargame.app' > dist/CNAME
      # Size budget — fails the deploy if the app JS bundle grows past the gzip ceiling in
      # scripts/check-bundle-size.mjs, so accidental bloat (e.g. a large library) can't ship
      # unnoticed. Intentional growth = bump the budget constant deliberately (shows in the diff).
      - name: Check bundle size budget
        run: npm run size
      # ── THE BROWSER LANE (2026-10-12) ─────────────────────────────────────────────────────────
      # Real-browser layout tests — Chromium and WebKit, tests/browser/*.browser.ts, run by
      # Playwright (playwright.config.ts) — against THE dist THAT WAS JUST BUILT: the same files the
      # upload step below hands to GitHub Pages, served under the same base. Vitest's DOM tests run
      # in jsdom, which lays nothing out; every rule about widths, wrapping, scrollbars and what
      # fits where is held here and nowhere else.
      #
      # ★ IT GATES THE DEPLOY, like every step above it. A layout rule that only advises is not a
      # rule: the first time it went red on a day somebody wanted to ship, it would be read as noise
      # and from then on it would be noise. Weighed against that, honestly, is the one thing a
      # browser test can do that a unit test cannot — fail for no reason on a loaded runner — and
      # three things keep that from deciding a deploy:
      #   • the tests assert geometry AT REST and never a frame or a duration (the rule, and why, is
      #     at the top of tests/browser/support/app.ts), so nothing in them depends on speed;
      #   • ONE retry (playwright.config.ts), so a single stall cannot stop a deploy — and never a
      #     silent one: a test that needed its retry is listed as FLAKY in the run, raises a warning
      #     on it (the step after the tests), and its recorded trace is uploaded. A flaky test is a
      #     defect to fix that week, not a result to accept;
      #   • the step is bounded (`timeout-minutes`), so a hung browser fails in minutes, by name.
      #
      # ⚠ WHERE IT SITS IS LOAD-BEARING, IN BOTH DIRECTIONS.
      #   • AFTER the build, the CNAME step and the size check: it tests the finished artifact, not
      #     a second build of its own (two builds of one commit are not the same bytes — the deploy
      #     stamp is the build clock), and it is the slowest check in the gate, so everything
      #     cheaper has already had its chance to fail first.
      #   • BEFORE the upload and BEFORE the version tag: a red lane publishes nothing and SPENDS NO
      #     VERSION NUMBER. The tag step must stay last in this job — see its own note.
      #
      # THE COST: ESTIMATED at four to six minutes a deploy with the browsers cached — about one for
      # the system packages WebKit needs, and three to five for the tests on this runner's two
      # workers (they take 1.9 minutes on two workers of the laptop) — and about one more the first
      # time after a Playwright upgrade, while the browsers download again. ⚠ An estimate until the
      # first run here: read the real figure off that run's step timings and put it in this note.
      #
      # The browsers are cached under the exact Playwright version (each version pins its own
      # browser builds, so the version IS the cache's identity; read from the installed package, not
      # from package.json, so it is the version that will actually run). What a browser needs from
      # the SYSTEM — the shared libraries WebKit links against — is not in that cache and cannot
      # be: it is installed by apt on every run.
      - name: Read the installed Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore the test browsers from the cache
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Download the test browsers (only after a Playwright upgrade)
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit
      - name: Install the system packages the test browsers need
        run: npx playwright install-deps chromium webkit
      # The older build the lane keeps beside the one under test (tests/browser/support/oldSite: a
      # window of the version live while this one was made, on the same origin). Built from its own
      # commit the first time - a git worktree of it (which is one more reason fetch-depth must stay
      # 0), its own `npm ci`, its own Vite, a minute or two - and restored from this cache after that.
      # Keyed on that commit, on how it is built, and on this repository, whose base it is built for.
      - name: Read which older build the lane keeps
        id: oldsite
        run: node --input-type=module -e "const m = await import('./tests/browser/support/oldSite.js'); console.log('commit=' + m.OLD_SITE.commit)" >> "$GITHUB_OUTPUT"
      - name: Restore the older build from the cache
        uses: actions/cache@v4
        with:
          path: .lane-cache
          key: lane-old-site-${{ steps.oldsite.outputs.commit }}-${{ github.repository }}-${{ hashFiles('tests/browser/support/oldSite.js', 'tests/browser/support/buildOldSite.mjs') }}
      - name: Run the browser tests
        timeout-minutes: 20  # (15 for the tests, and room for the older build's first build)
        run: npm run test:browser
      # Runs whether the tests passed or failed (never when the run was cancelled): a test that
      # passed only on its retry is named in a warning on the run, so it cannot go by unseen.
      - name: Name any browser test that needed its retry
        if: ${{ !cancelled() }}
        run: node tests/browser/support/reportFlaky.js
      # The run's report, and the recorded trace of every test that failed an attempt — what
      # `npx playwright show-trace` replays. Kept two weeks.
      - name: Keep the browser tests' report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist          # the finished files Vite produces
      # ── THE VERSION BUMP GUARD, HALF 2 OF 2 ──────────────────────────────────────────────────
      # Writes this version into the ledger half 1 reads: a lightweight tag on the commit that was
      # just built, in THIS repository only. Tags are per-repository on purpose — production and
      # staging each keep their own record, which is right, because they genuinely have not published
      # the same list of versions.
      #
      # ⚠ THE POSITION OF THIS STEP IS LOAD-BEARING: LAST IN `build`, WHICH IS BEFORE THE SITE GOES
      # LIVE. The `deploy` job below is what publishes, and it `needs: build`. So:
      #   • tag first, publish second  -> the ledger is only ever AHEAD of the site. "Ahead" costs a
      #     skipped version number, which costs nothing at all.
      #   • publish first, tag second  -> a failed or cancelled tag would leave the site UPDATED with
      #     no record of it, the ledger falls quietly behind reality, and the next duplicate sails
      #     straight through. That is unrecoverable by inspection, which is why it is not done.
      # And if this step itself fails, the build job fails, so `deploy` never runs and nothing ships.
      #
      # ⚠ THE WHOLE REF COMES FROM THE GUARD'S STEP OUTPUT — `v2.21.0`, not `2.21.0` with a `v` glued
      # on here. Gluing was the original shape and it was wrong: while the guard still accepted a
      # `v`-prefixed version, this produced `vv2.21.0` — a tag that `--list v*` matches but the
      # parser refuses, so that version went unrecorded and could ship a SECOND time. The version
      # regex is strict now, and taking the ref whole removes the last place one is assembled outside
      # the validated path. A lightweight tag (no `-a`) needs no git identity configured, and
      # `origin` already carries the checkout's credentials.
      - name: Record this version in the deploy ledger
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # Fail closed if that output is ever missing — a renamed `id:`, a deleted step. Without
          # this, the line below would run `git tag "v"`, and `v` IS a legal tag name, so the deploy
          # would stay GREEN, publish, and write a ledger entry nothing can read. That was the one
          # fail-OPEN path in the whole feature.
          if [ -z "$TAG" ]; then
            echo "::error::app-version: the version guard produced no tag name, so this build cannot be recorded in the deploy ledger. Nothing has been published. Check the 'Check this version has never shipped here' step and its 'id: version'."
            exit 1
          fi
          git tag "$TAG"
          # The remote rejecting an existing tag is the LAST line of defence: the guard read the
          # ledger ~5 minutes ago, so a second push inside that window can pass the check and still
          # be a duplicate. Correct already — but git's own message says nothing about versions, so
          # this gives that path the one human-readable sentence it was missing.
          git push origin "$TAG" || {
            echo "::error::app-version: $TAG already exists on this repository — another run claimed this number between this build's checkout and now. Nothing has been published. Raise \"version\" in package.json and push again (see scripts/versionLedger.mjs)."
            exit 1
          }

  # Step 2: publish the assembled website to GitHub Pages.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Narrower than the workflow-level grant above: publishing reads nothing and writes no code, so
    # the `contents: write` the BUILD job needs for its version tag is handed straight back here.
    # Only the job that actually writes a tag ever holds the permission to write one.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
