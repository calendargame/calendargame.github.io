<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <!-- Pinch-zoom is DELIBERATELY disabled (maximum-scale=1, user-scalable=no, plus the
       gesturestart preventDefault below) for a locked, native-app feel — the site owner's
       choice (re-confirmed 2026-06-05, Stage E4). This is the one thing keeping the Lighthouse
       Accessibility score at ~92 (the "viewport" audit) — an accepted tradeoff, NOT a bug; do
       not "fix" it. To re-enable zoom for accessibility instead, drop maximum-scale/user-scalable
       here AND remove the gesturestart handler in the script below. -->
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="theme-color" content="#0d1117">
  <title>Calendar Game</title>
  <meta name="description" content="A free, mobile-first trainer for fast mental day-of-the-week calculation — practice the doomsday method with timed drills, deduction puzzles, and instant date lookups."/>
  <!-- Social-share / link-preview cards (Open Graph + Twitter). The image is generated from the
       W5 icon by design/icons/build-og.mjs (public/og-image.jpg, 1200x630). The og:url + absolute
       image URLs point at the canonical site https://calendargame.app (the printed/book URL the
       cutover connects). OG requires ABSOLUTE image URLs. -->
  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="Calendar Game"/>
  <meta property="og:title" content="Calendar Game"/>
  <meta property="og:description" content="Master Mental Day-of-the-Week Calculation"/>
  <meta property="og:url" content="https://calendargame.app/"/>
  <meta property="og:image" content="https://calendargame.app/og-image.jpg"/>
  <meta property="og:image:width" content="1200"/>
  <meta property="og:image:height" content="630"/>
  <meta property="og:image:alt" content="The Calendar Game app icon beside the tagline Master Mental Day-of-the-Week Calculation"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="Calendar Game"/>
  <meta name="twitter:description" content="Master Mental Day-of-the-Week Calculation"/>
  <meta name="twitter:image" content="https://calendargame.app/og-image.jpg"/>
  <meta name="application-name" content="Calendar Game">
  <meta name="apple-mobile-web-app-title" content="Calendar Game">
  <!-- PWA standalone (Stage D3): launches full-screen from the home screen. No safe-area
       handling in the app, so the status bar is a solid (non-translucent) bar — content
       starts below it. Verify the standalone look on iPhone at the acceptance deploy. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <!-- Icons (generated from the W5 master by design/icons/build-icons.mjs). The web app
       manifest link + service-worker registration are injected by vite-plugin-pwa. -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- Head preload of the home-screen icon: fetches it at the very start of parsing so it's cached
       before iOS's Add-to-Home-Screen sheet can ask for it. The end-of-body warm <img> below
       consumes the preload, so no "preloaded but unused" console warning. -->
  <link rel="preload" as="image" href="/apple-touch-icon.png" fetchpriority="high">
  <!-- Dark-mode home-screen icon is DISABLED. iOS does not reliably honor a dark-variant
       apple-touch-icon (often needs a remove + re-add, or ignores it), so we ship the single
       light icon. The dark master (design/icons/icon-piday-trace-dark.svg) is kept; to re-enable,
       uncomment the link below AND the dark lines in design/icons/build-icons.mjs, then re-run it.
  <link rel="apple-touch-icon" href="/apple-touch-icon-dark.png" media="(prefers-color-scheme: dark)"> -->
  <!-- iOS LAUNCH FRAMES (generated by design/icons/build-splash.mjs): the static PNG iOS shows from
       the home-screen tap until the page's first web paint — without one that frame is blank white
       (iOS ignores the manifest's background_color). Each PNG is the #boot splash below pre-rendered
       at ONE exact device size, so the OS frame hands off seamlessly into the identical in-page
       splash. iOS only honors an exact pt/pixel-ratio match (a lone fallback is ignored), hence one
       link per iPhone size class, portrait-only (landscape falls back to blank — accepted for a
       portrait-first app). iOS caches the frame at Add-to-Home-Screen time: an existing install must
       delete + re-add the icon to pick these up. Deliberately IDENTICAL on staging + live (both hand
       off to the same lavender-on-dark splash); the gray staging distinction stays on icons + OG. -->
  <link rel="apple-touch-startup-image" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/apple-splash-640-1136.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/apple-splash-750-1334.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash-1242-2208.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash-1125-2436.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/apple-splash-828-1792.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash-1242-2688.png">
  <link rel="apple-touch-startup-image" media="(device-width: 360px) and (device-height: 780px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash-1080-2340.png">
  <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash-1170-2532.png">
  <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash-1179-2556.png">
  <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash-1206-2622.png">
  <link rel="apple-touch-startup-image" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash-1260-2736.png">
  <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash-1284-2778.png">
  <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash-1290-2796.png">
  <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/apple-splash-1320-2868.png">
  <!-- Apply the SAVED theme + its matching toolbar color BEFORE React mounts, so there's no
       wrong-theme / dark-toolbar flash on first paint (Q2). Mirrors the store's resolution
       (useSystem ? OS-dark?darkTheme:lightTheme : manualTheme) from the settings store's saved
       payload; falls back to the OS light/dark default (= SETTINGS_DEFAULTS) when nothing is saved.
       The color map is each theme's --tc in src/index.css — keep in sync if those change. The map is
       also stamped as <html>'s background so any frame painted before the external stylesheet
       applies is theme-colored, never white (App's theme effect re-stamps it on runtime theme
       switches, which is what repaints the app when a preset switch changes the theme). Also blocks
       the iOS pinch-zoom gesture (the deliberate locked zoom; see the viewport meta above).

       ★★ WHICH SETTINGS PAYLOAD, THOUGH — the settings store is PER-PRESET (the owner was explicit
       that not even the theme stays global), so this script has to resolve the ACTIVE PRESET before
       it can know where the theme is. It reads the global registry 'cg-presets-v1' for activeId and
       composes the key exactly as src/store/presets.ts's `presetKey` does — base key for preset 1,
       base+'~p'+id for every other. Preset 1's key really is the bare base key, so a device that has
       never created a second preset (and therefore has no registry entry at all) takes the SAME path
       it always did, byte for byte. Duplicating that one expression is unavoidable — this script
       runs before any module can load — so tests/bootTheme.dom pins it against the real `presetKey`
       and fails if either side drifts.
       ⚠ A registry that is missing, unparseable or naming a preset with no saved settings falls
       through to the OS default, which is the same graceful landing this script has always had for
       a missing payload; store/presets' normalizeRegistry repairs the registry itself moments later,
       and App's theme effect then repaints. Getting the first frame wrong on a tampered registry is
       the correct trade against getting it wrong on every normal boot. -->
  <script>(function(){
    var d=window.matchMedia('(prefers-color-scheme: dark)').matches,t;
    try{
      var p=1;try{p=JSON.parse(localStorage.getItem('cg-presets-v1')).state.activeId||1;}catch(e){}
      var s=JSON.parse(localStorage.getItem('cg-settings-v1'+(p===1?'':'~p'+p))).state;
      t=s.useSystem?(d?s.darkTheme:s.lightTheme):s.manualTheme;
    }catch(e){}
    if(!t)t=d?'dusk':'light';
    document.documentElement.setAttribute('data-theme',t);
    var c={dusk:'#0d1117',midnight:'#000',nebula:'#0b0714',parchment:'#f0e8d5',light:'#f2f2f7'},m=document.querySelector("meta[name='theme-color']");
    if(m&&c[t])m.content=c[t];
    document.documentElement.style.background=c[t]||'#0d1117';
    document.addEventListener('gesturestart',function(e){e.preventDefault();});
  })();</script>
  <!-- Pre-React BOOT SPLASH (Q3 Loading screen): a BODY-LEVEL sibling of #root (NOT inside it), so
       React's first commit can't wipe it. Styled inline here because the built stylesheet is swapped to a
       non-blocking preload (vite.config.js bootCssPreload) — that makes this splash the page's FIRST
       PAINT, covering the whole load (CSS + JS fetch/parse + React mount) instead of a white flash. App
       owns its removal (dismissBootSplash in src/main.tsx): after it's been VISIBLE ≥0.5s (the rAF stamp
       after the markup below) AND the real stylesheet has applied (window.__cssReady / 'app-css-ready');
       the auto-update path removes it the moment the Updating screen takes over. z-index:100 keeps it
       covering the app React mounts beneath it. Theme-aware bg (the boot script set data-theme above);
       the logo is lavender on dark themes, brand-purple on the light themes for contrast. Static — no
       text/animation (the animated screen is the Updating overlay in src/main.tsx). The SVG is the W5
       logo glyph (kept in sync with src/components/W5Logo.tsx + that overlay). -->
  <style>
    html{background:#0d1117}
    #boot{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#0d1117}
    [data-theme="midnight"] #boot{background:#000}
    [data-theme="nebula"] #boot{background:#0b0714}
    [data-theme="parchment"] #boot{background:#f0e8d5}
    [data-theme="light"] #boot{background:#f2f2f7}
    #boot .bw{position:relative;display:flex;align-items:center;justify-content:center;color:#c4b5fd}
    [data-theme="parchment"] #boot .bw,[data-theme="light"] #boot .bw{color:#7c3aed}
    #boot .bg{position:absolute;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(196,181,253,.2) 0%,rgba(196,181,253,0) 66%)}
    [data-theme="parchment"] #boot .bg,[data-theme="light"] #boot .bg{background:radial-gradient(circle,rgba(124,58,237,.16) 0%,rgba(124,58,237,0) 66%)}
  </style>
</head>
<!-- NO class HERE, AND THAT IS DELIBERATE. <body> used to wear `text-(--tx-50)`, which was pure
     duplication: index.css already says body{color:var(--body-color)}, and on the two light themes
     --tx-50 IS var(--body-color). On the three dark themes the two differ slightly (245,243,255 vs
     250,245,255), and the unlayered stylesheet rule was winning, so the utility had never painted
     anything in any theme. Moving the custom block into @layer components would have handed the
     utility that fight — flipping the inherited colour of ~400 elements across the whole app as a
     side effect of an unrelated fix. Deleting the class instead keeps every one of them on exactly
     the colour it has today, and leaves the layer change touching one element. If body text ever
     needs a different colour, change --body-color in the theme rows; do not re-add a utility here. -->
<body>
  <div id="root" class="min-h-screen"></div>
  <div id="boot"><div class="bw"><div class="bg"></div>
    <svg width="174" height="188" viewBox="178 173 146 158" fill="none" aria-hidden="true" style="position:relative">
      <g fill="currentColor" opacity="0.3"><circle cx="256" cy="256" r="10"/><circle cx="310" cy="316" r="10"/><circle cx="202" cy="316" r="10"/><circle cx="202" cy="256" r="10"/></g>
      <!-- trace dimmed 0.7 — matches the icon master (line dimmer than dots); keep #boot / W5Logo / BootOverlay identical -->
      <path d="M310,256 C313,226 313,206 310,196 C300,184 240,184 202,196" stroke="currentColor" stroke-opacity="0.7" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="currentColor"><circle cx="310" cy="256" r="10"/><circle cx="310" cy="196" r="10"/></g>
      <circle cx="202" cy="196" r="9" fill="currentColor"/><circle cx="202" cy="196" r="19" fill="none" stroke="currentColor" stroke-width="5"/>
    </svg>
  </div></div>
  <!-- Stamp WHEN the splash actually became visible (the first rendering opportunity ≈ its first
       paint). App's boot hold counts 0.5s of VISIBLE time from this — not from navigation start,
       which runs long before first paint on a real network / service-worker cold boot. -->
  <script>requestAnimationFrame(function(){window.__bootShownAt=performance.now()});</script>
  <!-- Warm the home-screen icon into the browser cache on first load. Without this, tapping iOS's
       "Add to Home Screen" before the icon has downloaded makes iOS fall back to a generic snapshot
       (the icon must already be cached when that preview sheet renders). The head <link rel=preload>
       above starts the fetch even earlier (at parse start); this real hidden <img> then CONSUMES the
       preload, so browsers that don't use apple-touch-icon never log a "preloaded but unused"
       warning. -->
  <img src="/apple-touch-icon.png" alt="" aria-hidden="true" fetchpriority="high"
       style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none" />
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
